apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-study-ai-agent
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: student-study-ai-agent.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: student-study-ai-agent
                port:
                  name: http
